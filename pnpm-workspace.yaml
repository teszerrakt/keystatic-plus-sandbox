# Native binaries: esbuild for the build, sharp for images.
allowBuilds:
  esbuild: true
  sharp: true
# The packed fork core depends on the forked design system by an npm alias that
# is not published. Point it at the tarball beside it; `pnpm use-fork` keeps both in step.
overrides:
  '@keystar/ui': file:vendor/teszerrakt-keystar-ui-0.10.0-plus.1.0.0-pr4.tgz
